<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05081c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CRYSTAL LEGENDS</title>
<meta name="description" content="4つのクリスタルと時の輪をめぐる、ブラウザで遊べるオリジナル・クラシックRPG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="loading"><div class="crys"></div><p>CRYSTAL LEGENDS</p><small>Loading…</small></div>
<div id="rotate">📱 横向きにすると大きな画面で遊べます</div>
<div id="touch">
  <div id="dpad"><div class="arrow up">▲</div><div class="arrow left">◀</div><div class="arrow right">▶</div><div class="arrow down">▼</div></div>
  <div id="btns">
    <div class="btn b" data-act="cancel">B</div>
    <div class="btn a" data-act="ok">A</div>
  </div>
  <div id="topbtns"><div class="sbtn" data-act="menu">MENU</div><div class="sbtn" data-act="map">MAP</div><div class="sbtn" data-act="auto">AUTO</div><div class="sbtn" data-act="dash">RUN</div></div>
</div>
<div id="nameinput"><div class="box"><p>名前を入力（8文字まで）</p><input type="text" maxlength="8" autocomplete="off"><button>決定</button></div></div>
<noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
<script src="game.js"></script>
</body>
</html>
